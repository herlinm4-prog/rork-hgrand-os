name: Validate HGRAND OS

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/sol-voice-memory-hardening

jobs:
  expo-static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies without rewriting lockfile
        run: bun install --no-save

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint
